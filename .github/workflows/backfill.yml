name: backfill

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/*.json'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Fetch full history for Git timestamp-based processing

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true

      - name: Run backfill script
        run: node scripts/backfill-id.js

      - name: Commit & Push changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: backfill missing IDs"
            git push "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" HEAD:main
            echo "Changes pushed - main deploy workflow will handle deployment"
          fi
